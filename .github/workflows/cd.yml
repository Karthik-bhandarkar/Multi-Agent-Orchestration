name: EduPulse CD Pipeline

on:
  workflow_run:
    workflows: ["EduPulse CI Pipeline"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    name: Production Deployment Trigger
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Render Deploy Hook
        shell: bash
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "$HOOK_URL" ]; then
            curl -f -s -S -X POST "$HOOK_URL"
            echo "Render deployment hook triggered successfully."
          else
            echo "WARNING: RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub Repository Secrets. Skipping trigger."
          fi

      - name: Confirm deploy status
        shell: bash
        run: |
          set -euo pipefail
          echo "EduPulse CD Pipeline execution finished successfully."

      - name: Handle CD Failure & Alert
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================================"
          echo "❌ CRITICAL: EduPulse CD Pipeline Deployment Failed!"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Workflow Run: ${{ github.run_id }}"
          echo "========================================================"
          exit 1
