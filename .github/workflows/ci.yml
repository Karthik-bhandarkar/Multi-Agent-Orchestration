name: EduPulse CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Code Verification & Automated Testing
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with flake8
        shell: bash
        run: |
          set -euo pipefail
          flake8 src/ api/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run pytest suite
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENV: test
          DB_PATH: ./data/test_edupulse.db
          LOG_LEVEL: DEBUG
        run: |
          set -euo pipefail
          python -m src.db.init_db
          python -m src.rag.vector_store
          pytest tests/ -v --tb=short

      - name: Handle CI Failure & Alert
        if: failure()
        shell: bash
        run: |
          echo "========================================================"
          echo "❌ CRITICAL: EduPulse CI Pipeline Execution Failed!"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Workflow Run: ${{ github.run_id }}"
          echo "Branch: ${{ github.ref }}"
          echo "========================================================"
          exit 1
